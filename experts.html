for(const k in D){const m={};const ic=IC[k].split(" ");D[k][2].split("\n").forEach(l=>{const[a,n,x,p,e]=l.split("|");m[a]={id:a,n,max:+x,p:p?p.split(","):[],e,ic:ic[a-1]||"✨"}});
 const dep=id=>{const s=m[id];return s.d??(s.d=s.p.length?1+Math.max(...s.p.map(dep)):0)};Object.keys(m).forEach(dep);G[k]=m}
/* 트리 배치: 깊이별 행, 부모 위치 평균에 맞춰 가로 배치 */
const W=84,TS=58,H=98,SP=94,RH=150,PAD=22,LY={};
for(const k in G){const rows=[];Object.values(G[k]).forEach(s=>(rows[s.d]=rows[s.d]||[]).push(s));
 rows.forEach((r,d)=>{
  if(d===0){r.forEach((s,i)=>s.x=i*SP)}
  else{r.forEach(s=>s.dx=s.p.reduce((a,p)=>a+G[k][p].x,0)/s.p.length);
   r.sort((a,b)=>a.dx-b.dx);let pv=-1e9;r.forEach(s=>{s.x=Math.max(s.dx,pv+SP);pv=s.x});
   const sh=r.reduce((a,s)=>a+s.dx-s.x,0)/r.length;r.forEach(s=>s.x+=sh)}
  r.forEach(s=>s.y=d*RH+PAD)});
 let mn=1e9,mx=-1e9;Object.values(G[k]).forEach(s=>{mn=Math.min(mn,s.x);mx=Math.max(mx,s.x)});
 Object.values(G[k]).forEach(s=>s.x=s.x-mn+W/2+PAD);
 LY[k]={w:Math.round(mx-mn+W+PAD*2),h:(rows.length-1)*RH+H+PAD*2}}
let st={};try{st=JSON.parse(localStorage.getItem("dding-wiki-expert-skill-v8")||"{}")}catch(e){}
let cur="mining",sel={},flt="all",tg={};
const lv=(k,i)=>+(st[k+i]||0);
const save=()=>{try{localStorage.setItem("dding-wiki-expert-skill-v8",JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const fm=n=>(+n).toLocaleString("ko-KR");
const lvl=(k,id)=>{const t=L[k]&&L[k][id];return t?t.split(";").map(x=>x.split(",")):[]};
const sumc=(k,id,a,b)=>{let g=0,p=0;lvl(k,id).slice(a,b).forEach(r=>{g+=r[2]*1000;p+=+r[1]});return[g,p]};
const cb=(g,p,q)=>`<div class="costs"><div><i>🪙</i><span>골드</span><b>${q?"?":fm(g)}</b></div><div><i>💎</i><span>어빌리티 스톤</span><b>${q?"?":fm(p*2)}</b></div><div><i>🎖️</i><span>스킬 포인트</span><b>${q?"?":fm(p)}</b></div></div>`;
const FL=[["all","전체"],["learned","배운 스킬"],["max","만렙"],["none","미습득"]];
const pass=(f,l,s)=>f==="all"||(f==="learned"&&l>0)||(f==="max"&&l>=s.max)||(f==="none"&&l===0);
const cs=()=>G[cur][sel[cur]||Object.keys(G[cur])[0]];
/* Cloud adapter: preserve the existing localStorage save format and all 100 skill IDs. */
window.DDING_SKILL_BRIDGE={
  get:()=>({...st}),
  replace:(incoming)=>{st={...incoming};save();render()},
  maxLevels:()=>Object.fromEntries(Object.entries(G).flatMap(([k,group])=>Object.values(group).map(skill=>[k+skill.id,skill.max])))
};
function setLv(s,v){st[cur+s.id]=Math.max(0,Math.min(s.max,v));save();render();window.dispatchEvent(new Event('dding:skill-updated'))}
function render(){
  const m=G[cur],all=Object.values(m),done=all.filter(s=>lv(cur,s.id)>0).length,full=all.filter(s=>lv(cur,s.id)>=s.max).length;
  const s=cs(),l=lv(cur,s.id),R=lvl(cur,s.id),mx=s.max;
  $("tabs").innerHTML=Object.keys(D).map(k=>{const n=Object.values(G[k]).filter(q=>lv(k,q.id)>0).length;return `<button class="tab" data-k="${k}" aria-pressed="${k===cur}">${D[k][1]} ${D[k][0]} 전문가<i>${n}/${Object.keys(G[k]).length}</i></button>`}).join("");
  $("tt").textContent=`${D[cur][0]} 전문가`;
  $("flt").innerHTML=FL.map(([k,n])=>`<button class="f" data-f="${k}" aria-pressed="${k===flt}">${n}</button>`).join("");
  $("mini").textContent=`배운 ${done}/${all.length} · 만렙 ${full}`;
  /* 상단 요약 */
  let sg=0,sp=0,rg=0,rp=0,u=0;
  all.forEach(q=>{const v=lv(cur,q.id),a=sumc(cur,q.id,0,v),b=sumc(cur,q.id,v,q.max);sg+=a[0];sp+=a[1];rg+=b[0];rp+=b[1];lvl(cur,q.id).slice(v,q.max).forEach(r=>{if(!+r[1]&&!+r[2])u=1})});
  const pl=u?"+":"";
  $("sum").innerHTML=[["🪙",`${D[cur][0]} 스킬에 쓴 골드`,fm(sg)+"G"],["💎","쓴 어빌리티 스톤",fm(sp*2)+"개"],["🪙","전부 만렙까지 남은 골드",fm(rg)+"G"+pl],["💎","남은 어빌리티 스톤",fm(rp*2)+"개"+pl]].map(([i,a,b])=>`<div class="sc"><div class="si">${i}</div><div><span>${a}</span><b>${b}</b></div></div>`).join("");
  /* 트리 보드 */
  const ly=LY[cur];
  let paths="";
  all.forEach(c=>c.p.forEach(pid=>{const p=m[pid],x1=p.x,y1=p.y+H,x2=c.x,y2=c.y,my=y2-16;
    paths+=`<path d="M${x1},${y1}V${my}H${x2}V${y2}" fill="none" stroke="${lv(cur,pid)?"var(--tonb)":"var(--lnk)"}" stroke-width="2" stroke-dasharray="6 5"/>`}));
  $("tree").style.width=ly.w+"px";$("tree").style.height=ly.h+"px";
  $("tree").innerHTML=`<svg width="${ly.w}" height="${ly.h}">${paths}</svg>`+all.map(q=>{const v=lv(cur,q.id);
    return `<button class="n${v?" on":""}${v>=q.max?" max":""}${s.id===q.id?" sel":""}${pass(flt,v,q)?"":" dim"}" data-i="${q.id}" style="left:${q.x-W/2}px;top:${q.y}px" aria-label="${q.n} ${v}/${q.max}"><span class="nt"><span class="ni">${skillArt(q)}</span><span class="bd">${v}/${q.max}</span></span><span class="nl">${q.n}</span></button>`}).join("");
  /* 상세 패널 */
  const t=Math.min(mx,Math.max(l+1,+tg[cur+s.id]||mx)),[tgG,tgP]=sumc(cur,s.id,l,t);
  const cur_=l?(R[l-1]?R[l-1][0]:"-"):"-",nxt=l<mx&&R[l]?R[l][0]:"-";
  const nr=R[l];
  $("det").innerHTML=`<div class="top2"><span class="tag">${D[cur][0]}</span><span class="tag g">최대 ${mx}레벨</span>${s.p.length?`<span class="tag g">선행: ${s.p.map(p=>m[p].n).join(", ")}</span>`:`<span class="tag g">시작 스킬</span>`}</div>
  <div class="hd"><span class="nt"><span class="ni">${skillArt(s)}</span></span><h2>${s.n}</h2></div><div class="desc">${s.e}</div>
  <div class="lab"><span>레벨</span><em>Lv.${l} / ${mx}</em></div>
  <div class="segs">${Array.from({length:mx},(_,i)=>`<button class="seg${i<l?" on":""}" data-l="${i+1}" aria-label="Lv ${i+1}"></button>`).join("")}</div>
  <div class="lab"><span>효과</span></div>
  <div class="bon"><div><span>현재</span><b>${cur_}</b></div><u>→</u><div class="nx"><span>${l<mx?"다음 Lv."+(l+1):"만렙"}</span><b>${l<mx?nxt:"달성!"}</b></div></div>
  <div class="lab"><span>다음 레벨 강화 비용</span></div>
  ${l<mx&&nr?cb(nr[2]*1000,+nr[1],!+nr[1]&&!+nr[2]):`<p class="note" style="margin:0">${l>=mx?"이미 만렙이에요.":"비용 정보가 없어요."}</p>`}
  ${l<mx?`<div class="lab"><span>Lv.${l} → 목표 레벨 총 비용</span><select class="sel2" id="tg">${Array.from({length:mx-l},(_,i)=>l+1+i).map(v=>`<option value="${v}"${v===t?" selected":""}>Lv.${v}${v===mx?" (Max)":""}</option>`).join("")}</select></div>${cb(tgG,tgP)}`:""}
  <div class="acts"><button class="b" id="rs"${l?"":" disabled"}>초기화</button><button class="b" id="dec"${l?"":" disabled"}>−1 레벨</button><button class="b p" id="inc"${l<mx?"":" disabled"}>+1 레벨</button><button class="b m" id="mx"${l<mx?"":" disabled"}>Max</button></div>
  ${R.length?`<div class="lvpanel"><div class="lvhead">레벨별 상세 보기</div><div class="tw"><table><thead><tr><th>Lv</th><th>효과</th><th>포인트</th><th>골드</th><th>스톤</th></tr></thead><tbody>${R.map((x,i)=>`<tr class="${i<l?"d":i===l?"nx":""}"><td>${i+1}</td><td>${x[0]}</td><td>${x[1]}</td><td>${+x[2]?fm(x[2]*1000):"?"}</td><td>${x[1]*2}</td></tr>`).join("")}</tbody></table></div></div>`:""}
  <p class="note">출처: 띵타이쿤 위키 · 스톤은 요구 포인트의 2배예요 · ‘?’는 위키에 비용이 안 적힌 레벨이에요.</p>`}
function informParentHeight(){
 if(window.parent===window)return;
 const wrap=document.querySelector('.wrap');
 const h=Math.ceil(wrap.getBoundingClientRect().height + wrap.offsetTop + 8);
 window.parent.postMessage({type:'dding-expert-size',height:h},'*');
}
if(window.ResizeObserver){new ResizeObserver(()=>requestAnimationFrame(informParentHeight)).observe(document.querySelector('.wrap'));}
window.addEventListener('load',informParentHeight);
window.addEventListener('resize',informParentHeight);
document.addEventListener('toggle',informParentHeight,true);
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-k]"),f=e.target.closest("[data-f]"),n=e.target.closest("[data-i]"),b=e.target.closest("[data-l]"),id=e.target.closest("button")?.id;
  if(c){cur=c.dataset.k;render()}
  else if(f){flt=f.dataset.f;render()}
  else if(n){sel[cur]=n.dataset.i;render();
    if(matchMedia("(max-width:1000px)").matches)$("det").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})}
  else if(b){const s=cs(),v=+b.dataset.l;setLv(s,lv(cur,s.id)===v?v-1:v)}
  else if(id==="rs")setLv(cs(),0);
  else if(id==="dec")setLv(cs(),lv(cur,cs().id)-1);
  else if(id==="inc")setLv(cs(),lv(cur,cs().id)+1);
  else if(id==="mx")setLv(cs(),cs().max);
});
document.addEventListener("change",e=>{if(e.target.id==="tg"){tg[cur+cs().id]=+e.target.value;render()}});
render();
</script>
