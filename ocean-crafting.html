    /* v30: wide, compact recipe cards matching the supplied reference */
    .recipes{grid-template-columns:minmax(0,1fr);gap:12px}
    .recipe{background:#fff;border:1px solid #e5def7;border-radius:19px;padding:18px;gap:14px;box-shadow:0 3px 10px #2e24500a}
    .recipe-head{position:relative;display:flex;align-items:center;gap:15px;padding-right:72px;min-height:78px}
    .recipe-head>.icon{width:82px;height:82px;border:2px solid #c8a98b;border-radius:15px;background:#f4ebe5;box-shadow:0 1px 0 #fff inset}
    .recipe-head>.icon.key{background:#fff3e6;border-color:#dfc39e}
    .recipe-head .icon-img{width:68px;height:68px;object-fit:contain;image-rendering:pixelated}
    .recipe-intro{display:flex;flex-direction:column;gap:4px}
    .recipe-name{font-size:15px;line-height:1.5;color:#14213e;letter-spacing:-.25px}
    .recipe-info{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}

    .recipe>.materials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .recipe .material{display:flex;min-height:55px;width:100%;padding:6px 8px;border-radius:12px;border:1px solid #e5def9;background:#f9f7ff;gap:8px;line-height:1.4;overflow:hidden}

    .material-picture .mini-icon{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}

        high=Math.min(window.innerHeight-10,window.parent.innerHeight-frame.top-12);
      }
    }catch(_){}
    if(high-low<90){low=10;high=Math.max(110,window.innerHeight-10)}
    return {low,high};
  }
  function positionItemTooltip(target){
    if(!target||tooltip.style.display==='none')return;
    const {low,high}=visibleYBounds();
    tooltip.style.maxHeight=Math.max(100,high-low)+'px';
    const r=target.getBoundingClientRect(),w=tooltip.offsetWidth,h=tooltip.offsetHeight,pad=10;
    const left=Math.min(window.innerWidth-w-pad,Math.max(pad,r.left));
    const above=r.top-h-10,below=r.bottom+10;
    const top=above>=low?above:(below+h<=high?below:Math.max(low,Math.min(high-h,below)));
    tooltip.style.left=Math.round(left)+'px';tooltip.style.top=Math.round(top)+'px';
  }
  function positionItemDialog(){
    if(itemDialog.hidden)return;
    const panel=itemDialog.querySelector('.item-dialog-panel');
    if(!panel)return;
    try{
      if(window.parent!==window&&window.frameElement){
        const {low,high}=visibleYBounds();
        itemDialog.style.alignItems='flex-start';
        panel.style.maxHeight=Math.max(190,high-low-14)+'px';
        const margin=Math.max(0,low+(high-low-panel.offsetHeight)/2-18);
        panel.style.marginTop=Math.round(margin)+'px';
      }
    }catch(_){}
  }
  function showItemTooltip(target){
    if(!target||!itemDialog.hidden)return;
    activeTooltipTarget=target;
    tooltip.innerHTML=itemCardHtml(target.dataset.itemName,Number(target.dataset.itemNeeded)||0);
    tooltip.style.display='block';
    positionItemTooltip(target);
  }
  function openItemDialog(name,needed){
    hideItemTooltip();
    if(itemDialog.hidden)previouslyFocused=document.activeElement;
    const used=detailMatches(name);
    const uses=used.length?used.map(r=>`<button type="button" class="tip-used-button" data-drill-item="${esc(recipeName(r))}">${itemVisual(r.name,'mini')}<strong>${esc(recipeName(r))}</strong><span>완성 ×${fmt(r.output)}</span></button>`).join(''):'<div class="tip-not-used">현재 등록된 다른 제작법에서 사용처를 찾지 못했어요.</div>';
    itemDialogContent.innerHTML=`<button type="button" class="item-dialog-close" data-close-item aria-label="상세 정보 닫기">×</button>${itemCardHtml(name,needed)}<section class="tip-usage"><h2 class="tip-usage-title" id="itemDialogTitle">${esc(name)} · 사용처 ${fmt(used.length)}종</h2>${uses}<p class="tip-footnote">사용처를 누르면 해당 제작품의 조합식도 확인할 수 있어요.</p></section>`;
    itemDialog.hidden=false;document.body.classList.add('item-dialog-open');
    positionItemDialog();
    itemDialogContent.querySelector('[data-close-item]').focus();
  }
  function closeItemDialog(){
    itemDialog.hidden=true;document.body.classList.remove('item-dialog-open');itemDialogContent.innerHTML='';
    if(previouslyFocused&&previouslyFocused.isConnected)previouslyFocused.focus();
    previouslyFocused=null;
  }
  for(const pane of [$('mainPane'),$('cartContent')]){
    pane.addEventListener('pointerover',e=>{
      if(e.pointerType==='touch')return;
      const target=e.target.closest('[data-item-name]');
      if(target && (target!==activeTooltipTarget || tooltip.style.display==='none'))showItemTooltip(target);
    });
    pane.addEventListener('pointermove',e=>{
      if(e.pointerType==='touch')return;
      const target=e.target.closest('[data-item-name]');
      if(target && (target!==activeTooltipTarget || tooltip.style.display==='none'))showItemTooltip(target);
    });
    pane.addEventListener('pointerout',e=>{
      const target=e.target.closest('[data-item-name]');
      if(target&&!target.contains(e.relatedTarget))hideItemTooltip();
    });
    pane.addEventListener('focusin',e=>{const target=e.target.closest('[data-item-name]');if(target)showItemTooltip(target)});
    pane.addEventListener('focusout',e=>{const target=e.target.closest('[data-item-name]');if(target&&!target.contains(e.relatedTarget))hideItemTooltip()});
    pane.addEventListener('click',e=>{
      const target=e.target.closest('[data-item-name]');
      if(target){e.preventDefault();const found=getRecipe(target.dataset.itemName);if(found)navigateToRecipe(found);else openItemDialog(target.dataset.itemName,Number(target.dataset.itemNeeded)||0)}
    });
  }
  itemDialog.addEventListener('click',e=>{
    if(e.target===itemDialog||e.target.closest('[data-close-item]')){closeItemDialog();return;}
    const btn=e.target.closest('[data-drill-item]');
    if(btn){const found=getRecipe(btn.dataset.drillItem);if(found)navigateToRecipe(found);else openItemDialog(btn.dataset.drillItem,1);}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!itemDialog.hidden)closeItemDialog();else hideItemTooltip();return;}
    if(e.key==='Tab'&&!itemDialog.hidden){
      const focusables=[...itemDialog.querySelectorAll('button:not([disabled])')];
      if(!focusables.length)return;
      const first=focusables[0],last=focusables[focusables.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  });
  window.addEventListener('scroll',()=>{hideItemTooltip();positionItemDialog()},{passive:true});
  window.addEventListener('resize',()=>{hideItemTooltip();positionItemDialog()},{passive:true});
  try{
    if(window.parent!==window){
      window.parent.addEventListener('scroll',()=>{hideItemTooltip();positionItemDialog()},{passive:true});
      window.parent.addEventListener('resize',()=>{hideItemTooltip();positionItemDialog()},{passive:true});
    }
  }catch(_){}
  isShop?renderShops():renderRecipes();renderCart();updateSize();
  const initialFocus=params.get('focus');
  if(initialFocus && !isShop)focusRecipeCard(initialFocus);
})();
</script>
</body>
</html>
